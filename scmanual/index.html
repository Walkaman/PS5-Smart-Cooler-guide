<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMART COOLER MANUAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="content"></div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
marked.setOptions({
  gfm: true,
  breaks: true
});

fetch('README.md')
  .then(r => {
    if (!r.ok) throw new Error('README.md не найден');
    return r.text();
  })
  .then(md => {
    const container = document.getElementById('content');
    container.innerHTML = marked.parse(md);
    
    // === ОБРАБОТКА ИЗОБРАЖЕНИЙ И ПОДПИСЕЙ ===
    
    // 1. Сначала находим все img и их родительские p
    const imageParagraphs = container.querySelectorAll('p:has(img)');
    
    imageParagraphs.forEach(p => {
      const img = p.querySelector('img');
      if (!img) return;
      
      // Проверяем, есть ли после этого p элемент em (внутри другого p)
      let nextP = p.nextElementSibling;
      let captionEm = null;
      
      // Ищем следующий p, который содержит em и не содержит img
      while (nextP && nextP.tagName === 'P') {
        const em = nextP.querySelector('em');
        if (em && !nextP.querySelector('img')) {
          captionEm = em;
          break;
        }
        nextP = nextP.nextElementSibling;
      }
      
      if (captionEm) {
        // Создаём обёртку для img и подписи
        const wrapper = document.createElement('div');
        wrapper.className = 'image-with-caption';
        
        // Переносим img в обёртку (без p)
        p.parentNode.insertBefore(wrapper, p);
        wrapper.appendChild(img);
        
        // Удаляем пустой p после переноса img
        if (p.childNodes.length === 0) {
          p.remove();
        }
        
        // Переносим em в обёртку (без p)
        const emParent = captionEm.parentNode;
        wrapper.appendChild(captionEm);
        
        // Удаляем пустой p после переноса em
        if (emParent && emParent.childNodes.length === 0) {
          emParent.remove();
        }
        
        // Применяем стили через CSS классы
        img.classList.add('has-caption');
        captionEm.classList.add('image-caption');
      } else {
        // Если подписи нет, просто убираем обёртку p
        p.parentNode.replaceChild(img, p);
      }
    });
    
    // === ОБРАБОТКА ССЫЛОК ===
    container.querySelectorAll('a[href]').forEach(el => {
      const href = el.getAttribute('href');
      if (href && href.startsWith('#')) {
        return;
      }
      el.setAttribute('target', '_blank');
      el.setAttribute('rel', 'noopener noreferrer');
    });
  })
  .catch(err => {
    document.getElementById('content').innerHTML = `
      <div style="color: #ff6b6b; padding: 20px; text-align: center;">
        <h3>Ошибка загрузки</h3>
        <p>${err.message}</p>
        <p style="font-size: 0.9rem; color: #888;">Убедитесь, что файл README.md находится в той же папке</p>
      </div>
    `;
  });
</script>
</body>
</html>
